<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Modern Online Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; }
        header { background-color: #232f3e; color: white; padding: 15px 20px; text-align: center; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; padding: 20px; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .product-title { font-size: 1.2rem; margin-bottom: 8px; color: #111; }
        .product-price { color: #b12704; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 10px 25px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .buy-btn:hover { background-color: #f7ca00; }
        footer { text-align: center; padding: 20px; background-color: #131921; color: white; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ ShopEasy Store</h1>
        <p>Your Favorite Shopping Destination</p>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Featured Products</h2>
        
        <div class="products-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones" class="product-image">
                <h3 class="product-title">Wireless Headphones</h3>
                <div class="product-price">$49.99</div>
                <button class="buy-btn">Buy Now</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch" class="product-image">
                <h3 class="product-title">Smart Fitness Watch</h3>
                <div class="product-price">$89.99</div>
                <button class="buy-btn">Buy Now</button>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sports Shoes" class="product-image">
                <h3 class="product-title">Running Sports Shoes</h3>
                <div class="product-price">$65.00</div>
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ShopEasy. All rights reserved.</p>
    </footer>

</body>
</html>
